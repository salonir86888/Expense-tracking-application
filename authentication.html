<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUREUM | Sovereign Authentication</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: #0d0d0d; color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; }
    
    .top-header { height: 75px; background: #ffffff; border-bottom: 1px solid #f0ece1; display: flex; justify-content: space-between; align-items: center; padding: 0 50px; }
    .brand-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-emblem { width: 42px; height: 42px; background: linear-gradient(135deg, #e5d3b3, #c5a059); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; font-weight: 700; color: #ffffff; font-size: 1.4rem; }
    .logo-text { font-family: 'Cinzel', serif; font-size: 1.5rem; font-weight: 700; color: #c5a059; letter-spacing: 2px; }

    .auth-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%); }
    .auth-card { background: #ffffff; width: 100%; max-width: 450px; border-radius: 16px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #c5a05933; }
    
    .auth-header { text-align: center; margin-bottom: 30px; }
    .auth-title { font-family: 'Cinzel', serif; font-size: 1.8rem; font-weight: 700; color: #111; margin-bottom: 8px; }
    .auth-subtitle { font-size: 0.85rem; color: #71717a; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.75rem; font-weight: 600; color: #64748b; margin-bottom: 6px; letter-spacing: 0.5px; }
    .form-group input { width: 100%; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.9rem; outline: none; transition: border 0.2s; }
    .form-group input:focus { border-color: #c5a059; }

    .btn-submit { width: 100%; background: linear-gradient(135deg, #e5d3b3, #c5a059); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; letter-spacing: 1px; cursor: pointer; transition: opacity 0.2s; margin-top: 10px; }
    .btn-submit:hover { opacity: 0.95; }

    .auth-toggle { text-align: center; margin-top: 25px; font-size: 0.85rem; color: #71717a; }
    .auth-toggle span { color: #c5a059; font-weight: 600; cursor: pointer; text-decoration: underline; margin-left: 5px; }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header class="top-header">
    <a href="#" class="brand-logo">
      <div class="logo-emblem">A</div>
      <span class="logo-text">AUREUM</span>
    </a>
  </header>

  <!-- AUTHENTICATION CONTAINER -->
  <div class="auth-container">
    
    <!-- LOGIN FORM -->
    <div class="auth-card" id="loginCard">
      <div class="auth-header">
        <h1 class="auth-title">ACCESS VAULT</h1>
        <p class="auth-subtitle">Enter your credentials to manage sovereign assets.</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label>EMAIL ADDRESS</label>
          <input type="email" id="loginEmail" placeholder="e.g. user@aureum.com" required>
        </div>
        <div class="form-group">
          <label>PASSWORD</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-submit" id="loginBtn">SIGN IN TO VAULT</button>
      </form>

      <div class="auth-toggle">
        Don't have an asset account? <span onclick="toggleAuth('signup')">Create Account</span>
      </div>
    </div>

    <!-- SIGN UP FORM -->
    <div class="auth-card" id="signupCard" style="display: none;">
      <div class="auth-header">
        <h1 class="auth-title">CREATE ACCOUNT</h1>
        <p class="auth-subtitle">Begin your journey with private asset management.</p>
      </div>

      <form id="signupForm">
        <div class="form-group">
          <label>FULL NAME</label>
          <input type="text" id="signupName" placeholder="e.g. Rohan Singh" required>
        </div>
        <div class="form-group">
          <label>EMAIL ADDRESS</label>
          <input type="email" id="signupEmail" placeholder="e.g. user@aureum.com" required>
        </div>
        <div class="form-group">
          <label>PASSWORD</label>
          <input type="password" id="signupPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-submit" id="signupBtn">REGISTER VAULT</button>
      </form>

      <div class="auth-toggle">
        Already have an account? <span onclick="toggleAuth('login')">Sign In</span>
      </div>
    </div>

  </div>

  <!-- LOAD CONFIG.JS FIRST TO RECEIVE API_BASE_URL -->
  <script src="config.js"></script>

  <script>
    // Toggle between Sign In and Sign Up Cards
    function toggleAuth(mode) {
      const loginCard = document.getElementById('loginCard');
      const signupCard = document.getElementById('signupCard');

      if (mode === 'signup') {
        loginCard.style.display = 'none';
        signupCard.style.display = 'block';
      } else {
        signupCard.style.display = 'none';
        loginCard.style.display = 'block';
      }
    }

    // 1. SIGN IN LOGIC (LOGIN API)
    document.getElementById('loginForm').onsubmit = async function(e) {
      e.preventDefault();

      const btn = document.getElementById('loginBtn');
      btn.innerText = "AUTHENTICATING...";
      btn.disabled = true;

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          // Store token and user data in localStorage
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));

          // Redirect to main Dashboard
          window.location.href = "dashboard.html";
        } else {
          alert(data.message || "Authentication failed. Check your credentials.");
        }
      } catch (error) {
        console.error("Login Error:", error);
        alert("Server connection failed. Please ensure the backend server is active.");
      } finally {
        btn.innerText = "SIGN IN TO VAULT";
        btn.disabled = false;
      }
    };

    // 2. SIGN UP LOGIC (REGISTER API)
    document.getElementById('signupForm').onsubmit = async function(e) {
      e.preventDefault();

      const btn = document.getElementById('signupBtn');
      btn.innerText = "CREATING ACCOUNT...";
      btn.disabled = true;

      const name = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;

      try {
        const response = await fetch(`${API_BASE_URL}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (response.ok) {
          alert("Account created successfully! Please sign in with your credentials.");
          this.reset();
          toggleAuth('login');
        } else {
          alert(data.message || "Account creation failed.");
        }
      } catch (error) {
        console.error("Registration Error:", error);
        alert("Server connection failed. Please try again.");
      } finally {
        btn.innerText = "REGISTER VAULT";
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
